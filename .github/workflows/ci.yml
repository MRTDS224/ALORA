name: CI — Tests, Migrations & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest & Alembic (PostgreSQL 16 + FFmpeg)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alora_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d alora_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql://postgres@localhost:5432/alora_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/alora_test
      STORAGE_BACKEND: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify Alembic migrations on clean PostgreSQL 16
        run: uv run alembic upgrade head

      - name: Run automated test suite (isolated DB & local storage)
        run: uv run pytest -v

  docker-build:
    name: Verify Production Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alora:ci-check .
