[project]
name = "alora"
version = "0.4.0"
description = "ALORA — Open-source oral speech corpus platform (WAXAL-inspired) for under-resourced African languages, starting with Susu (Guinea)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mamadou Tahirou Diallo", email = "mrtdsow@outlook.com" }
]
keywords = [
    "speech-corpus",
    "asr",
    "tts",
    "nlp",
    "susu",
    "african-languages",
    "low-resource",
    "waxal",
    "fastapi",
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/MRTDS224/ALORA"
Repository = "https://github.com/MRTDS224/ALORA"
Issues = "https://github.com/MRTDS224/ALORA/issues"

[project.scripts]
alora = "alora:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
